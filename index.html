<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REVAURA — A studio before the subject</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #07080B;
    --ink-2: #101318;
    --ink-3: #171B22;
    --ice: #8FCFEA;
    --ice-soft: #BFE6F5;
    --slate: #6C7A9C;
    --platinum: #D9DCE3;
    --paper: #ECEDF1;
    --mist: #7B8291;
    --mist-dim: #494F5B;

    --font-display: 'Fraunces', serif;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #root{ position: relative; min-height: 100vh; }

  .canvas-layer{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .grain{
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg xmlns='/Users/rishika/Desktop/REVAURA/logo.png' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .vignette{
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(7,8,11,0.6) 100%);
  }

  .shell{
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- HEADER ---------- */
  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  header.in{ opacity: 1; transform: translateY(0); }

  .brand{
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .brand-mark{
    width: 30px; height: 30px;
    display:block;
    filter: drop-shadow(0 0 10px rgba(143,207,234,0.25));
  }
  .brand-name{
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.22em;
    color: var(--paper);
    font-weight: 500;
  }

  .status-pill{
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--mist);
    border: 1px solid rgba(123,130,145,0.25);
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.02);
  }
  .status-dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ice);
    box-shadow: 0 0 0 0 rgba(143,207,234,0.6);
    animation: pulse 2.6s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(143,207,234,0.55); }
    70%{ box-shadow: 0 0 0 7px rgba(143,207,234,0); }
    100%{ box-shadow: 0 0 0 0 rgba(143,207,234,0); }
  }

  /* ---------- HERO ---------- */
  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px 0 40px;
  }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.32em;
    color: var(--ice-soft);
    text-transform: uppercase;
    margin: 0 0 26px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .eyebrow.in{ opacity: 1; transform: translateY(0); }

  .wordmark{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(56px, 13vw, 148px);
    line-height: 0.92;
    letter-spacing: 0.02em;
    margin: 0 0 34px;
    display: flex;
    justify-content: center;
  }
  .wordmark span{
    display: inline-block;
    opacity: 0;
    transform: translateY(28px);
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper) 55%, var(--platinum) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: opacity 0.7s cubic-bezier(.2,.7,.3,1), transform 0.7s cubic-bezier(.2,.7,.3,1);
  }
  .wordmark span.in{ opacity: 1; transform: translateY(0); }
  .wordmark span.accent{
    background: linear-gradient(180deg, var(--ice-soft) 0%, var(--ice) 60%, var(--slate) 140%);
    -webkit-background-clip: text;
    background-clip: text;
    font-style: italic;
    font-weight: 400;
  }

  /* ---------- PULL QUOTE ---------- */
  .quote-block{
    max-width: 560px;
    margin: 0 0 44px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .quote-block.in{ opacity: 1; transform: translateY(0); }

  .quote-mark{
    display: block;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 68px;
    line-height: 1;
    color: var(--ice);
    opacity: 0.55;
    margin-bottom: -20px;
    user-select: none;
  }

  .quote-text{
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(20px, 2.6vw, 27px);
    line-height: 1.45;
    color: var(--platinum);
    margin: 0;
  }

  .quote-attribution{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--mist-dim);
    text-transform: uppercase;
  }
  .quote-attribution .rule{
    width: 26px; height: 1px;
    background: var(--mist-dim);
  }

  /* ---------- FORM ---------- */
  .capture{
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    width: 100%;
    max-width: 440px;
  }
  .capture.in{ opacity: 1; transform: translateY(0); }

  .capture-label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--mist-dim);
    margin-bottom: 12px;
  }

  .capture-form{
    display: flex;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 14px;
    padding: 6px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .capture-form.focused{
    border-color: rgba(143,207,234,0.5);
    box-shadow: 0 0 0 4px rgba(143,207,234,0.08);
  }
  .capture-form input{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--paper);
    font-family: var(--font-body);
    font-size: 14.5px;
    padding: 12px 14px;
  }
  .capture-form input::placeholder{ color: var(--mist-dim); }

  .capture-btn{
    display: flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--ice-soft), var(--ice));
    color: #0A1620;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.25s ease, filter 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .capture-btn:hover{ filter: brightness(1.08); transform: translateY(-1px); }
  .capture-btn:active{ transform: translateY(0); }
  .capture-btn .arrow{ transition: transform 0.25s ease; }
  .capture-btn:hover .arrow{ transform: translateX(3px); }
  .capture-btn:disabled{ opacity: 0.6; cursor: default; }

  .capture-error{
    font-family: var(--font-mono);
    font-size: 12px;
    color: #E39A9A;
    margin-top: 10px;
    text-align: left;
    padding-left: 4px;
    min-height: 16px;
  }

  .success-box{
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(143,207,234,0.07);
    border: 1px solid rgba(143,207,234,0.32);
    border-radius: 14px;
    padding: 16px 18px;
    text-align: left;
    animation: riseIn 0.5s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes riseIn{
    from{ opacity: 0; transform: translateY(8px) scale(0.98); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }
  .success-check{
    width: 34px; height: 34px;
    min-width: 34px;
    border-radius: 50%;
    background: rgba(143,207,234,0.15);
    display: flex; align-items: center; justify-content: center;
  }
  .success-text{ font-size: 13.5px; color: var(--mist); line-height: 1.5; }
  .success-text b{ color: var(--ice-soft); font-family: var(--font-mono); font-weight: 500; }

  /* ---------- PILLARS ---------- */
  .pillars{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 56px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .pillars.in{ opacity: 1; transform: translateY(0); }
  .pillar{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.15em;
    color: var(--mist-dim);
    border: 1px solid rgba(123,130,145,0.2);
    border-radius: 999px;
    padding: 8px 14px;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .pillar:hover{ color: var(--ice-soft); border-color: rgba(143,207,234,0.4); }

  /* ---------- FOOTER ---------- */
  footer{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 26px 0 34px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--mist-dim);
    border-top: 1px solid rgba(255,255,255,0.06);
    opacity: 0;
    transition: opacity 1s ease;
  }
  footer.in{ opacity: 1; }
  footer a{ color: var(--mist); text-decoration: none; border-bottom: 1px solid rgba(123,130,145,0.3); }
  footer a:hover{ color: var(--ice-soft); border-color: var(--ice-soft); }

  @media (max-width: 640px){
    .capture-form{ flex-direction: column; }
    .capture-btn{ justify-content: center; }
    footer{ flex-direction: column; gap: 10px; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useEffect, useRef, useState, useCallback } = React;

function LogoMark() {
  return (
    <img src="logo.png" alt="REVAURA Logo" className="brand-mark" />
  );
}

/* ---------------- Generative Aura Canvas ---------------- */
function AuraCanvas() {
  const canvasRef = useRef(null);
  const mouseRef = useRef({ x: 0.5, y: 0.42 });
  const reducedMotion = useRef(
    window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
  );

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let raf;
    let w, h, dpr;

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener('resize', resize);

    const onMove = (e) => {
      mouseRef.current.x = e.clientX / window.innerWidth;
      mouseRef.current.y = e.clientY / window.innerHeight;
    };
    window.addEventListener('mousemove', onMove);

    const blobs = [
      { baseX: 0.42, baseY: 0.40, r: 0.32, color: [143,207,234], speed: 0.00042, phase: 0 },
      { baseX: 0.58, baseY: 0.48, r: 0.28, color: [108,122,156], speed: 0.00035, phase: 2.1 },
      { baseX: 0.50, baseY: 0.56, r: 0.24, color: [200,205,215], speed: 0.00050, phase: 4.2 },
    ];

    const particles = Array.from({ length: 34 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.3 + 0.4,
      speed: Math.random() * 0.00018 + 0.00006,
      drift: Math.random() * 0.0004 - 0.0002,
      alpha: Math.random() * 0.3 + 0.07,
    }));

    let t = 0;
    const draw = () => {
      t += 1;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#07080B';
      ctx.fillRect(0, 0, w, h);

      const mx = mouseRef.current.x;
      const my = mouseRef.current.y;

      blobs.forEach((b) => {
        const ang = t * b.speed + b.phase;
        const ox = Math.sin(ang * 1.3) * 0.06 + (mx - 0.5) * 0.04;
        const oy = Math.cos(ang * 1.1) * 0.05 + (my - 0.5) * 0.04;
        const cx = (b.baseX + ox) * w;
        const cy = (b.baseY + oy) * h;
        const rad = b.r * Math.min(w, h) * (1 + Math.sin(ang * 0.7) * 0.06);

        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
        const [r, g, bl] = b.color;
        grad.addColorStop(0, `rgba(${r},${g},${bl},0.5)`);
        grad.addColorStop(0.5, `rgba(${r},${g},${bl},0.14)`);
        grad.addColorStop(1, `rgba(${r},${g},${bl},0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      });

      particles.forEach((p) => {
        p.y -= p.speed;
        p.x += p.drift;
        if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
        ctx.beginPath();
        ctx.arc(p.x * w, p.y * h, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(217,220,227,${p.alpha})`;
        ctx.fill();
      });

      if (!reducedMotion.current) {
        raf = requestAnimationFrame(draw);
      }
    };
    draw();

    return () => {
      window.removeEventListener('resize', resize);
      window.removeEventListener('mousemove', onMove);
      if (raf) cancelAnimationFrame(raf);
    };
  }, []);

  return <canvas ref={canvasRef} className="canvas-layer" style={{ filter: 'blur(38px)' }} />;
}

/* ---------------- Main App ---------------- */
function App() {
  const [stage, setStage] = useState(0);
  const [email, setEmail] = useState('');
  const [focused, setFocused] = useState(false);
  const [error, setError] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const [position, setPosition] = useState(null);

  useEffect(() => {
    const timers = [0, 150, 320, 520, 720, 900, 1080].map((delay, i) =>
      setTimeout(() => setStage(i + 1), delay)
    );
    return () => timers.forEach(clearTimeout);
  }, []);

  const validate = (val) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);

  const handleSubmit = useCallback((e) => {
    e.preventDefault();
    if (!email.trim()) { setError('An email helps us know where to send it.'); return; }
    if (!validate(email)) { setError('That doesn\'t look like a complete email.'); return; }
    setError('');
    const seed = Math.abs(Array.from(email).reduce((a, c) => a + c.charCodeAt(0), 0));
    setPosition(1200 + (seed % 380));
    setSubmitted(true);
  }, [email]);

  const word = "REVAURA";

  return (
    <React.Fragment>
      <AuraCanvas />
      <div className="grain" />
      <div className="vignette" />

      <div className="shell">
        <header className={stage >= 1 ? 'in' : ''}>
          <div className="brand">
            <LogoMark />
            <span className="brand-name">REVAURA</span>
          </div>
          <div className="status-pill">
            <span className="status-dot" />
            <span>currently: shaping the thesis</span>
          </div>
        </header>

        <main>
          <p className={"eyebrow" + (stage >= 2 ? ' in' : '')}>A studio before the subject</p>

          <h1 className="wordmark" aria-label="REVAURA">
            {word.split('').map((ch, i) => (
              <span
                key={i}
                className={(stage >= 3 ? 'in' : '') + (i >= 3 ? ' accent' : '')}
                style={{ transitionDelay: stage >= 3 ? `${i * 55}ms` : '0ms' }}
              >
                {ch}
              </span>
            ))}
          </h1>

          <div className={"quote-block" + (stage >= 4 ? ' in' : '')}>
            <span className="quote-mark">"</span>
            <p className="quote-text">
              What's common is only unfinished.<br/>We intend to finish it.
            </p>
            <div className="quote-attribution">
              <span className="rule" />
              <span>REVAURA</span>
              <span className="rule" />
            </div>
          </div>

          <div className={"capture" + (stage >= 5 ? ' in' : '')}>
            {!submitted ? (
              <form onSubmit={handleSubmit}>
                <div className="capture-label">get in before there's anything to see</div>
                <div className={"capture-form" + (focused ? ' focused' : '')}>
                  <input
                    type="email"
                    placeholder="you@company.com"
                    value={email}
                    onChange={(e) => { setEmail(e.target.value); if (error) setError(''); }}
                    onFocus={() => setFocused(true)}
                    onBlur={() => setFocused(false)}
                    aria-label="Email address"
                  />
                  <button className="capture-btn" type="submit">
                    Notify me <span className="arrow">→</span>
                  </button>
                </div>
                <div className="capture-error">{error}</div>
              </form>
            ) : (
              <div className="success-box">
                <div className="success-check">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M3 8.5L6.2 11.8L13 4.2" stroke="#BFE6F5" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
                <div className="success-text">
                  You're <b>#{position}</b> on the list.<br/>
                  We'll write when there's something worth reading.
                </div>
              </div>
            )}
          </div>

          <div className={"pillars" + (stage >= 6 ? ' in' : '')}>
            <span className="pillar">REFINEMENT OVER SPEED</span>
            <span className="pillar">PROOF OVER PITCH</span>
            <span className="pillar">FEW THINGS, DONE PROPERLY</span>
          </div>
        </main>

        <footer className={stage >= 7 ? 'in' : ''}>
          <span>© 2026 REVAURA</span>
          <a href="mailto:info@revaura.fun">info@revaura.fun</a>
        </footer>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
